name: Public registry qualification
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  registry:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025-vs2026
          - ubuntu-26.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Qualify anonymous registry tuple and both consumer layouts
        run: node scripts/qualify-public-registry.mjs --manifest test/registry-alpha.4.json
