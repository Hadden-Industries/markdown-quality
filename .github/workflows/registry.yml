name: Public registry qualification
on:
  push:
    branches: [main]
    paths:
      - test/registry-alpha.4.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - name: Qualify anonymous registry tuple and both consumer layouts
        run: node scripts/qualify-public-registry.mjs --manifest test/registry-alpha.4.json registry-qualification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-${{ matrix.os }}
          path: registry-qualification.json
          if-no-files-found: error
          retention-days: 30
