name: Public registry qualification
on:
  push:
    branches: [implement-markdown-quality]
    paths:
      - .github/workflows/registry.yml
      - scripts/qualify-public-registry.mjs
      - test/registry-alpha.2.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
      - name: Qualify anonymous registry tuple and both consumer layouts
        run: node scripts/qualify-public-registry.mjs registry-qualification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-${{ matrix.os }}
          path: registry-qualification.json
          if-no-files-found: error
          retention-days: 30
