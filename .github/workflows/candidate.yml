name: Transported candidate qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      trusted-sha:
        description: Full commit SHA of the reviewed archive/profile fixture
        type: string
        required: true
      candidate-sha:
        description: Full commit SHA of the candidate data fixture
        type: string
        required: true
permissions:
  contents: read
jobs:
  pack:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      runtimes: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ">=3.15.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python scripts/acquire-native.py
      - id: resolve
        name: Resolve minimum and latest supported runtimes
        run: |
          $runtimeMatrix = node scripts/node-matrix.js
          if ($LASTEXITCODE -ne 0) { throw "Node release metadata resolution failed" }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "matrix=$runtimeMatrix"
      - name: Pack one frozen tuple on Windows
        env:
          NODE_QUALIFICATION_MATRIX: ${{ steps.resolve.outputs.matrix }}
        run: node --input-type=module -e "import {packRelease} from './scripts/pack.js'; const r=packRelease(process.env.RUNNER_TEMP+'/candidate-release',JSON.parse(process.env.NODE_QUALIFICATION_MATRIX)); console.log(JSON.stringify({version:r.version,source:r.source,archives:r.archives.map(a=>({name:a.name,sha256:a.sha256,integrity:a.integrity,executableMode:a.executableMode}))}));"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-release
          path: ${{ runner.temp }}/candidate-release/
          if-no-files-found: error
          retention-days: 30
  consumer:
    name: ${{ matrix.node == '24.21.0' && format('consumer ({0})', matrix.os) || format('consumer ({0}, {1})', matrix.os, matrix.node) }}
    needs: pack
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pack.outputs.runtimes) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ">=3.15.0"
      - name: Acquire complete public OwlAPI corpus as data
        if: matrix.node == '24.21.0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hadden-Industries/owlapi
          ref: 073beefb7805130bc0452472d1a9c801471fbaf1
          path: performance-corpora/owlapi
          persist-credentials: false
      - name: Acquire complete public WebVOWL corpus as data
        if: matrix.node == '24.21.0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hadden-Industries/webvowl
          ref: b0fe00404eedf12a59084871863500869474bd3a
          path: performance-corpora/webvowl
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-release
          path: transported-release
          digest-mismatch: error
      - name: Qualify the same transported archives in both layouts
        if: matrix.node != '24.21.0'
        run: node scripts/qualify-public-registry.mjs --manifest transported-release/release-manifest.json --archives transported-release candidate-qualification.json
      - name: Qualify transported archives and measure reference-runtime performance
        if: matrix.node == '24.21.0'
        run: node scripts/qualify-public-registry.mjs --manifest transported-release/release-manifest.json --archives transported-release --performance-corpora performance-corpora --performance-output performance-observations candidate-qualification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.node == '24.21.0' && format('candidate-{0}', matrix.os) || format('candidate-{0}-{1}', matrix.os, matrix.node) }}
          path: candidate-qualification.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.node == '24.21.0'
        with:
          name: performance-${{ matrix.os }}
          path: performance-observations/
          if-no-files-found: error
          retention-days: 30
  shared:
    if: github.event_name == 'workflow_dispatch'
    # The local reference binds the reusable workflow to this exact caller commit.
    # Fixture commits carry reviewed archives/profile; candidate bytes remain data.
    uses: ./.github/workflows/markdown-quality.yml
    with:
      trusted-repository: Hadden-Industries/markdown-quality
      trusted-sha: ${{ inputs.trusted-sha }}
      candidate-repository: Hadden-Industries/markdown-quality
      candidate-sha: ${{ inputs.candidate-sha }}
