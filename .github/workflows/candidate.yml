name: Transported candidate qualification
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pack:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python scripts/acquire-native.py
      - name: Pack one frozen tuple on Windows
        run: node --input-type=module -e "import {packRelease} from './scripts/pack.js'; const r=packRelease(process.env.RUNNER_TEMP+'/candidate-release'); console.log(JSON.stringify({version:r.version,source:r.source,archives:r.archives.map(a=>({name:a.name,sha256:a.sha256,integrity:a.integrity,executableMode:a.executableMode}))}));"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-release
          path: ${{ runner.temp }}/candidate-release/
          if-no-files-found: error
          retention-days: 30
  consumer:
    needs: pack
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-release
          path: transported-release
          digest-mismatch: error
      - name: Qualify the same transported archives in both layouts
        run: node scripts/qualify-public-registry.mjs --manifest transported-release/release-manifest.json --archives transported-release candidate-qualification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.os }}
          path: candidate-qualification.json
          if-no-files-found: error
          retention-days: 30
