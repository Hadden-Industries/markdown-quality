name: Security
on:
  workflow_call: null
  workflow_dispatch: null
  schedule:
    - cron: 23 6 * * 1
permissions:
  contents: read
jobs:
  model:
    name: Validate Actions approval model
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - uses: github/codeql-action/setup-codeql@33d7b85da1a04171e211befe2c739303b9a4c066
        id: tools
        with:
          languages: actions
      - name: Preserve native rules and test approval boundaries
        env:
          CODEQL: ${{ steps.tools.outputs.codeql-path }}
          MODEL_TEMP: ${{ runner.temp }}
        run: node scripts/check-codeql-model.js "$CODEQL" "$MODEL_TEMP"
  codeql:
    name: Scan ${{ matrix.language }}
    needs: model
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - python
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ${{ matrix.language == 'actions' && './.github/codeql/actions-config.yml' || '' }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: /language:${{ matrix.language }}
