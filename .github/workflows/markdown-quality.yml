name: Shared trusted Markdown qualification
on:
  workflow_call:
    inputs:
      trusted-repository:
        type: string
        required: true
      trusted-sha:
        type: string
        required: true
      candidate-repository:
        type: string
        required: true
      candidate-sha:
        type: string
        required: true
      profile:
        type: string
        default: .markdown-quality-execution.json
      qualification-evidence:
        description: Retain selected qualification evidence for 30 days instead of routine success retention
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
env:
  MQ_TRUSTED_REPOSITORY: ${{ inputs.trusted-repository }}
  MQ_CANDIDATE_REPOSITORY: ${{ inputs.candidate-repository }}
  MQ_TRUSTED_ROOT: ${{ github.workspace }}/trusted
  MQ_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
  MQ_TRUSTED_SHA: ${{ inputs.trusted-sha }}
  MQ_CANDIDATE_SHA: ${{ inputs.candidate-sha }}
  MQ_PROFILE: ${{ inputs.profile }}
jobs:
  request:
    name: Review exact trusted qualification request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: producer
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: producer/.node-version
          package-manager-cache: false
      - name: Show immutable inputs before owner approval
        env:
          MQ_WORKFLOW_SHA: ${{ job.workflow_sha }}
          MQ_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: node producer/scripts/shared-qualification-admission.js request
  qualify:
    needs: request
    environment:
      name: markdown-quality-trusted-qualification
      url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate exact checkout identities
        env:
          MQ_WORKFLOW_SHA: ${{ job.workflow_sha }}
          MQ_WORKFLOW_REF: ${{ job.workflow_ref }}
          MQ_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          MQ_CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          if ($env:MQ_TRUSTED_SHA -notmatch '^[a-f0-9]{40}$' -or $env:MQ_CANDIDATE_SHA -notmatch '^[a-f0-9]{40}$' -or $env:MQ_WORKFLOW_SHA -notmatch '^[a-f0-9]{40}$') { throw 'Full immutable checkout and workflow identities are required' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MQ_WORKFLOW_SHA=$env:MQ_WORKFLOW_SHA"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MQ_WORKFLOW_REF=$env:MQ_WORKFLOW_REF"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MQ_WORKFLOW_REPOSITORY=$env:MQ_WORKFLOW_REPOSITORY"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MQ_CHECK_RUN_ID=$env:MQ_CHECK_RUN_ID"
          git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: producer
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: producer/.node-version
          package-manager-cache: false
      - name: Acquire immutable producer bootstrap graph
        working-directory: producer
        shell: bash
        run: node scripts/qualification-process.js producer-npm
      - name: Install immutable producer bootstrap graph
        working-directory: producer
        run: npm ci --ignore-scripts --no-audit --no-fund
        timeout-minutes: 5
      - name: Verify required reviewers and this run's owner approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: node producer/scripts/shared-qualification-admission.js verify
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.trusted-repository }}
          ref: ${{ inputs.trusted-sha }}
          path: trusted
          persist-credentials: false
      - id: profile
        name: Read shared trusted runtime/profile declarations
        run: |
          npm --prefix producer run ci:producer-toolchain
          if ($LASTEXITCODE -ne 0) { throw 'Producer identity recording failed' }
          node producer/scripts/shared-qualification.mjs bootstrap
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.profile.outputs.node }}
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ steps.profile.outputs.python }}
      - name: Isolate the trusted Python interpreter
        shell: bash
        run: |
          python -m venv "${{ runner.temp }}/shared-python"
          echo "VIRTUAL_ENV=${{ runner.temp }}/shared-python" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "${{ runner.temp }}/shared-python/Scripts" >> "$GITHUB_PATH"
          else
            echo "${{ runner.temp }}/shared-python/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.candidate-repository }}
          ref: ${{ inputs.candidate-sha }}
          path: candidate
          persist-credentials: false
      - name: Acquire trusted graph and qualify candidate data
        env:
          GH_TOKEN: ${{ github.token }}
        run: node producer/scripts/shared-qualification.mjs run
      - name: Package compact qualification evidence
        if: always()
        run: node producer/scripts/package-qualification-evidence.mjs
      - uses: ./producer/.github/actions/upload-evidence
        if: always()
        timeout-minutes: 5
        with:
          name: shared-markdown-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shared-markdown-upload/
          retention-days: ${{ inputs.qualification-evidence && 30 || (job.status != 'success' && 14 || 7) }}
