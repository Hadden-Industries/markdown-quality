name: Main qualification
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      qualification:
        description: Full qualification or a separate packed-recipient diagnostic
        default: full
        type: choice
        options:
          - full
          - installed-only
permissions:
  contents: read
  actions: read
jobs:
  host:
    name: Observe ${{ matrix.os }}
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - windows-2025-vs2026
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/setup-python
      - name: Observe the runner without product tests or dependency installation
        env:
          CI_OS: ${{ matrix.os }}
          HOST_PATH: ${{ runner.temp }}/ci-host-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}.json
        shell: bash
        run: node scripts/ci-host.js "$HOST_PATH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ runner.temp }}/ci-host-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}.json
          archive: false
          if-no-files-found: error
          retention-days: 1
  observe:
    name: Main / reuse decision
    if: always() && github.event_name == 'push'
    needs: host
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Reuse only complete equal-input PR qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-command.js observe
  full:
    name: Explicit FULL
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.qualification != 'installed-only'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  diagnostic-matrix:
    name: Resolve installed diagnostic matrix
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.qualification == 'installed-only'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - id: policy
        run: npm run ci:node-policy
  installed-diagnostic:
    name: Installed diagnostic
    needs: diagnostic-matrix
    uses: ./.github/workflows/installed-qualification.yml
    with:
      matrix: ${{ needs.diagnostic-matrix.outputs.matrix }}
