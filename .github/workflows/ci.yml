name: CI
on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review
  workflow_call: null
permissions:
  contents: read
  actions: read
concurrency:
  group: deliberate-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: Candidate policy
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - name: Admit the deliberate request and exact checkout
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; import {execFileSync} from "node:child_process"; const e=process.env; assert.ok(e.EVENT==="pull_request" && e.ACTION==="ready_for_review" && e.DRAFT==="false" || e.EVENT==="workflow_dispatch" && e.REF==="refs/heads/main"); assert.equal(execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),e.EXPECTED_SHA);'
      - name: Check source presentation before fan-out
        run: npm run check:source
      - id: policy
        run: npm run ci:node-policy
  product:
    name: Product
    needs: policy
    uses: ./.github/workflows/qualification.yml
    with:
      matrix: ${{ needs.policy.outputs.matrix }}
      emit-proof: ${{ github.event_name == 'pull_request' }}
      release-mode: true
    permissions:
      contents: read
      actions: read
  native:
    name: Native
    needs: policy
    uses: ./.github/workflows/native-qualification.yml
  dependencies:
    name: Dependencies
    needs: policy
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - name: Reject vulnerable dependency additions
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
      - run: npm run check:dependency-audit
  codeql:
    name: CodeQL
    needs: policy
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
  distribution:
    name: Distribution
    needs: product
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/download-evidence
        timeout-minutes: 15
        with:
          artifact-id: ${{ needs.product.outputs.archive-id }}
          path: frozen-release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: recipient-*
          path: recipient-security
          digest-mismatch: error
      - name: Generate inventories once for the exact qualified archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qualify-distribution-sbom.js frozen-release distribution-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distribution-${{ github.run_attempt }}
          path: distribution-evidence/
          if-no-files-found: error
          retention-days: 30
  acceptance:
    name: CI / acceptance
    if: always()
    needs:
      - policy
      - product
      - native
      - dependencies
      - codeql
      - distribution
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - name: Admit every mandatory result and original producing attempt
        id: proof
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_MATRIX: ${{ needs.policy.outputs.matrix }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-command.js record
      - name: Preserve compact independently checked PR proof
        if: github.event_name == 'pull_request' && steps.proof.outputs.path != ''
        timeout-minutes: 5
        uses: ./.github/actions/upload-evidence
        with:
          mode: upload
          path: ${{ steps.proof.outputs.path }}
          retention-days: 30
