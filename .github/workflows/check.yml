name: Package qualification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      runtimes: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - id: resolve
        run: |
          runtime_matrix=$(node scripts/node-matrix.js)
          echo "matrix=$runtime_matrix" >> "$GITHUB_OUTPUT"
  probe:
    name: probe (${{ matrix.os }}, ${{ matrix.node }})
    needs: matrix
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.runtimes) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ">=3.15.0"
          version: "0.13.0"
          activate-environment: true
          venv-path: ${{ runner.temp }}/python
          no-project: true
          enable-cache: false
      - name: Record current runtime and hosted image without installing dependencies
        env:
          LANE_OS: ${{ matrix.os }}
          LANE_NODE: ${{ matrix.node }}
        run: node scripts/ci-reuse-command.js lane
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Unavailable optimization evidence selects full testing.
        continue-on-error: true
        with:
          name: probe-${{ matrix.os }}-${{ matrix.node }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-ci-reuse/lane.json
          if-no-files-found: error
          retention-days: 1
  strategy:
    needs: [matrix, probe]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.verify.outputs.reuse }}
      reason: ${{ steps.verify.outputs.reason || steps.select.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: probe-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-ci-reuse/hosts
          merge-multiple: false
          digest-mismatch: error
      - id: select
        name: Find authenticated same-repository PR proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-reuse-command.js select
      - id: proof
        if: steps.select.outputs.available == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.select.outputs.artifact_id }}
          run-id: ${{ steps.select.outputs.run_id }}
          repository: Hadden-Industries/markdown-quality
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/package-ci-reuse/proof
          merge-multiple: false
          digest-mismatch: error
      - id: verify
        if: steps.select.outputs.available == 'true'
        name: Verify complete proof or select full testing
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_MATRIX: ${{ needs.matrix.outputs.runtimes }}
          PROOF_DOWNLOAD_OUTCOME: ${{ steps.proof.outcome }}
        run: node scripts/ci-reuse-command.js verify
      - if: steps.verify.outputs.reuse == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-reuse-decision-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-ci-reuse/decision.json
          if-no-files-found: error
          retention-days: 1
  package:
    name: package (${{ matrix.os }}, ${{ matrix.node }})
    needs: [matrix, strategy]
    if: always() && needs.matrix.result == 'success' && (needs.strategy.result != 'success' || needs.strategy.outputs.reuse != 'true')
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.runtimes) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ">=3.15.0"
          version: "0.13.0"
          activate-environment: true
          venv-path: ${{ runner.temp }}/python
          no-project: true
          enable-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python scripts/acquire-native.py
      - run: npm run check:full
      - name: Record the actual fully tested lane identity
        # Optional metadata never invalidates successful package tests.
        continue-on-error: true
        env:
          LANE_OS: ${{ matrix.os }}
          LANE_NODE: ${{ matrix.node }}
        run: node scripts/ci-reuse-command.js lane
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: executed-${{ matrix.os }}-${{ matrix.node }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-ci-reuse/lane.json
          if-no-files-found: error
          retention-days: 30
  required:
    needs: [matrix, probe, strategy, package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - id: decision
        if: needs.strategy.result == 'success' && needs.strategy.outputs.reuse == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-reuse-decision-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-ci-reuse/decision
          digest-mismatch: error
      - if: (needs.strategy.result != 'success' || needs.strategy.outputs.reuse != 'true') && needs.package.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: executed-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-ci-reuse/executed
          merge-multiple: false
          digest-mismatch: error
      - id: result
        name: Require full execution or revalidated original proof
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          REUSE: ${{ needs.strategy.result == 'success' && needs.strategy.outputs.reuse == 'true' }}
          FALLBACK_REASON: ${{ needs.strategy.outputs.reason }}
          QUALIFICATION_MATRIX: ${{ needs.matrix.outputs.runtimes }}
          DECISION_DOWNLOAD_OUTCOME: ${{ steps.decision.outcome }}
        run: node scripts/ci-reuse-command.js required
      - if: steps.result.outputs.recorded == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # A lost receipt never invalidates fresh tests or grants future reuse.
        continue-on-error: true
        with:
          name: package-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-ci-reuse/receipt.json
          if-no-files-found: error
          retention-days: 30
