name: Controlled native build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/native.yml
      - assets/native-build.json
      - scripts/build-native.py
      - scripts/native-evidence-contract.json
      - .github/actions/setup-python/**
      - .python-version
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve frozen upstream source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurtleTech-ehf/snapper
          ref: 407c2beb04607f6ccb421e6f6418dcc00e4c1e94
          path: native-source
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Build frozen source and collect rights evidence
        run: python scripts/build-native.py --platform ${{ matrix.platform }} --source native-source --output native-output --raw-evidence "${{ runner.temp }}/native-originals/cargo-${{ matrix.platform }}.json"
      - name: Retain original cargo-about bytes separately from recipient files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-originals-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-originals/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}
          path: native-output/
          if-no-files-found: error
          retention-days: 30
