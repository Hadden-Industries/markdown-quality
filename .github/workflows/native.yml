name: Controlled native build
on:
  workflow_dispatch:
    inputs:
      build-config:
        description: Frozen build input; candidate output requires separate qualification
        type: choice
        required: true
        default: scripts/native-build-next.json
        options:
          - scripts/native-build-next.json
          - assets/native-build.json
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve frozen upstream source bytes
        run: git config --global core.autocrlf false
      - uses: ./.github/actions/setup-python
      - name: Inspect selected build input
        id: build-input
        env:
          BUILD_CONFIG: ${{ inputs.build-config }}
        run: python scripts/build-native.py --config "$BUILD_CONFIG" --describe-config --github-output "$GITHUB_OUTPUT"
        shell: bash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TurtleTech-ehf/snapper
          ref: ${{ steps.build-input.outputs.source-commit }}
          path: native-source
          persist-credentials: false
      - name: Build frozen source and collect rights evidence
        env:
          BUILD_CONFIG: ${{ inputs.build-config }}
        shell: bash
        run: python scripts/build-native.py --config "$BUILD_CONFIG" --platform ${{ matrix.platform }} --source native-source --output native-output --raw-evidence "${{ runner.temp }}/native-originals/cargo-${{ matrix.platform }}.json"
      - name: Retain original cargo-about bytes separately from recipient files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-originals-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-originals/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-${{ matrix.platform }}
          path: native-output/
          if-no-files-found: error
          retention-days: 30
