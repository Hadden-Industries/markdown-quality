name: Controlled native build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/native.yml
      - assets/native-build.json
      - scripts/build-native.py
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve frozen upstream source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurtleTech-ehf/snapper
          ref: 407c2beb04607f6ccb421e6f6418dcc00e4c1e94
          path: native-source
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ">=3.15.0"
          version: "0.13.0"
          activate-environment: true
          venv-path: ${{ runner.temp }}/python
          no-project: true
          enable-cache: false
      - name: Build frozen source and collect rights evidence
        run: python scripts/build-native.py --platform ${{ matrix.platform }} --source native-source --output native-output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}
          path: native-output/
          if-no-files-found: error
          retention-days: 30
