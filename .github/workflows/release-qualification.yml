name: Qualify a deliberate release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact owner-selected version already committed on main
        required: true
        type: string
      force-fresh:
        description: Deliberately rebuild and rerun the complete qualification graph
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  resolve:
    if: github.repository == 'Hadden-Industries/markdown-quality' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
      archive-id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/setup-python
      - name: Check the requested version and current runtime policy
        id: resolve
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; import {readFileSync} from "node:fs"; assert.match(process.env.RELEASE_VERSION,/^[1-9]\d*\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u); assert.equal(JSON.parse(readFileSync("package.json")).version,process.env.RELEASE_VERSION);'
          matrix=$(node scripts/node-matrix.js)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Reuse complete original CI qualification when eligible
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_MATRIX: ${{ steps.resolve.outputs.matrix }}
          FORCE_FRESH: ${{ inputs.force-fresh }}
        run: node scripts/release-reuse.js reused-release
      - name: Retain unchanged archives and separate promotion authorization
        id: archive
        if: steps.reuse.outputs.reused == 'true'
        uses: ./.github/actions/upload-evidence
        timeout-minutes: 5
        with:
          name: qualified-producer-${{ github.run_attempt }}
          path: reused-release
          retention-days: 30
  fresh:
    needs: resolve
    if: needs.resolve.outputs.reused != 'true'
    uses: ./.github/workflows/release-fresh-qualification.yml
    with:
      version: ${{ inputs.version }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: write
  security:
    needs:
      - resolve
      - fresh
    if: always() && needs.resolve.result == 'success' && (needs.resolve.outputs.reused == 'true' || needs.fresh.result == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Provision the pinned npm audit client
        run: node scripts/qualification-process.js producer-npm
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/download-evidence
        timeout-minutes: 15
        with:
          artifact-id: ${{ needs.resolve.outputs.archive-id || needs.fresh.outputs.archive-id }}
          path: frozen-release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.resolve.outputs.reused != 'true'
        with:
          pattern: recipient-*
          path: recipient-security
          digest-mismatch: error
      - name: Use the original recipient graphs without reinstalling
        if: needs.resolve.outputs.reused == 'true'
        run: node scripts/release-reuse-evidence.js recipients frozen-release recipient-security
      - name: Require original CodeQL and current recipient dependency audits
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qualify-release-security.js frozen-release release-security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: release-security-${{ github.run_attempt }}
          path: release-security/
          if-no-files-found: error
          retention-days: 90
  distribution:
    needs:
      - resolve
      - fresh
    if: always() && needs.resolve.result == 'success' && (needs.resolve.outputs.reused == 'true' || needs.fresh.result == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/download-evidence
        timeout-minutes: 15
        with:
          artifact-id: ${{ needs.resolve.outputs.archive-id || needs.fresh.outputs.archive-id }}
          path: frozen-release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.resolve.outputs.reused != 'true'
        with:
          pattern: recipient-*
          path: recipient-security
          digest-mismatch: error
      - name: Generate inventories for freshly qualified archives
        if: needs.resolve.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qualify-distribution-sbom.js frozen-release distribution-evidence
      - name: Reuse inventories of the unchanged original archives
        if: needs.resolve.outputs.reused == 'true'
        run: node scripts/release-reuse-evidence.js distribution frozen-release distribution-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: release-distribution-${{ github.run_attempt }}
          path: distribution-evidence/
          if-no-files-found: error
          retention-days: 90
  qualified:
    needs:
      - resolve
      - fresh
      - security
      - distribution
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Require complete qualification and fresh release gates
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; const n=JSON.parse(process.env.NEEDS_JSON); assert.deepEqual(Object.keys(n).sort(),["distribution","fresh","resolve","security"]); for(const k of ["resolve","security","distribution"]) assert.equal(n[k].result,"success"); assert.equal(n.fresh.result,n.resolve.outputs.reused==="true"?"skipped":"success");'
          echo 'Qualified unchanged archives. Verify the signed landed-source tag and approve publication separately. No publishing authority was granted.' >> "$GITHUB_STEP_SUMMARY"
