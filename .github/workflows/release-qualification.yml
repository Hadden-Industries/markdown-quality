name: Qualify a deliberate release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact owner-selected version already committed on main
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  resolve:
    if: github.repository == 'Hadden-Industries/markdown-quality' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtimes: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Check requested version and freeze one matrix for all release gates
        id: resolve
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("package.json")); assert.match(process.env.RELEASE_VERSION,/^[1-9]\d*\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u); assert.equal(p.version,process.env.RELEASE_VERSION);'
          matrix=$(node scripts/node-matrix.js)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  product:
    needs: resolve
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      runtimes: ${{ needs.resolve.outputs.runtimes }}
  candidate:
    needs: resolve
    uses: ./.github/workflows/candidate.yml
    with:
      runtimes: ${{ needs.resolve.outputs.runtimes }}
  security:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-release
          path: frozen-release
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: recipient-*
          path: recipient-security
          digest-mismatch: error
      - name: Require exact-source CodeQL and recipient dependency audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qualify-release-security.js frozen-release release-security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-security-${{ github.run_attempt }}
          path: release-security/
          if-no-files-found: error
          retention-days: 90
  distribution:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-release
          path: frozen-release
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: recipient-*
          path: recipient-security
          digest-mismatch: error
      - name: Generate and validate distribution inventories against exact archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qualify-distribution-sbom.js frozen-release distribution-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-distribution-${{ github.run_attempt }}
          path: distribution-evidence/
          if-no-files-found: error
          retention-days: 90
  qualified:
    needs: [resolve, product, candidate, security, distribution]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every pre-publication gate without skipped work
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; const needs=JSON.parse(process.env.NEEDS_JSON); assert.deepEqual(Object.keys(needs).sort(),["candidate","distribution","product","resolve","security"]); for(const [name,job] of Object.entries(needs)) assert.equal(job.result,"success",name);'
          echo 'Qualification completed. Review the exact archives, gate evidence and manifest digest. Create and verify the signed source tag before manually staging native packages. This run has no publishing authority.' >> "$GITHUB_STEP_SUMMARY"
