name: Stage a qualified release for owner approval
on:
  workflow_dispatch:
    inputs:
      candidate-run:
        description: Successful manual release qualification run on main; continuation preserves its archives
        required: true
        type: string
      manifest-sha256:
        description: Approved original release-manifest SHA-256
        required: true
        type: string
      review-sha256:
        description: Owner-approved release-review.json attached to the signed-tag draft
        required: true
        type: string
      phase:
        description: Stage native packages first; core requires completed owner approvals and an explicit continuation
        required: true
        default: natives
        type: choice
        options:
          - natives
          - core
      recovery-run:
        description: Optional completed publication run to reconcile without republishing
        required: false
        type: string
      recovery-attempt:
        description: Exact prior attempt; required when recovery-run is supplied
        required: false
        type: string
      recovery-origins-sha256:
        description: Independently approved prior origin-map SHA-256; blank only for original legacy publication
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: markdown-quality-publication
  cancel-in-progress: false
env:
  CANDIDATE_RUN: ${{ inputs.candidate-run }}
  MANIFEST_SHA: ${{ inputs.manifest-sha256 }}
  REVIEW_SHA: ${{ inputs.review-sha256 }}
  STAGING_PHASE: ${{ inputs.phase }}
  RECOVERY_RUN: ${{ inputs.recovery-run }}
  RECOVERY_ATTEMPT: ${{ inputs.recovery-attempt }}
  RECOVERY_ORIGINS_SHA: ${{ inputs.recovery-origins-sha256 }}
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  NODE_AUTH_TOKEN: ""
  NPM_TOKEN: ""
  NPM_CONFIG_TOKEN: ""
  NODE_OPTIONS: ""
jobs:
  admit:
    if: github.repository == 'Hadden-Industries/markdown-quality' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Inspect exact completed candidate and current default branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]{0,15}$ ]]
          [[ "$MANIFEST_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$STAGING_PHASE" == natives || "$STAGING_PHASE" == core ]]
          if [[ "$STAGING_PHASE" == core ]]; then
            [[ -n "$RECOVERY_RUN" && -n "$RECOVERY_ORIGINS_SHA" ]]
          fi
          if [[ -n "$RECOVERY_RUN" ]]; then
            [[ "$RECOVERY_RUN" =~ ^[1-9][0-9]{0,15}$ ]]
            [[ "$RECOVERY_ATTEMPT" =~ ^[1-9][0-9]{0,15}$ ]]
            [[ -z "$RECOVERY_ORIGINS_SHA" || "$RECOVERY_ORIGINS_SHA" =~ ^[a-f0-9]{64}$ ]]
          else
            [[ -z "$RECOVERY_ATTEMPT" && -z "$RECOVERY_ORIGINS_SHA" ]]
          fi
          mkdir provider
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > provider/run.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > provider/current-ref.json
          gh api "repos/$GITHUB_REPOSITORY/environments/npm-publication" > provider/environment.json
          gh api "repos/$GITHUB_REPOSITORY/environments/npm-publication/deployment-branch-policies?per_page=100" > provider/branches.json
          if [[ -n "$RECOVERY_RUN" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN/attempts/$RECOVERY_ATTEMPT" > provider/previous-run.json
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN/attempts/$RECOVERY_ATTEMPT/jobs?per_page=100" > provider/previous-jobs.json
          fi
      - name: Bind the original candidate source and attempt
        id: candidate
        run: node scripts/prepare-publication-environment.js --candidate-context provider
      - name: Read same-attempt candidate jobs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ATTEMPT: ${{ steps.candidate.outputs.candidate-attempt }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/attempts/$CANDIDATE_ATTEMPT/jobs?per_page=100" > provider/jobs.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ steps.candidate.outputs.artifact-source }}
          path: artifact-source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-release
          path: frozen-release
          run-id: ${{ inputs.candidate-run }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: inputs.recovery-run != ''
        with:
          name: publication-source-and-manifest
          path: previous-publication
          run-id: ${{ inputs.recovery-run }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Verify approved archives and bind publication origins before any effect
        run: node scripts/verify-publication.js frozen-release "$MANIFEST_SHA" provider
      - name: Require the owner-created verified source tag before staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-tag.js frozen-release/release-manifest.json provider
      - name: Reconcile all prior publication attempts before granting any stage effect
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publication-history.js frozen-release provider/publication-history.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: publication-admission
          path: |
            provider/*.json
            frozen-release/release-manifest.json
            frozen-release/publication-origins.json
            previous-publication/frozen-release/*.json
          if-no-files-found: error
          retention-days: 90
  retained:
    needs: admit
    if: inputs.recovery-run != ''
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Select isolated npm configuration
        shell: bash
        run: node scripts/publication-npm.js isolate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-release
          path: frozen-release
          run-id: ${{ inputs.candidate-run }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: publication-admission
          digest-mismatch: error
      - name: Revalidate exact admitted origin-map context
        run: node scripts/prepare-publication-environment.js --environment frozen-release
      - name: Acquire pinned hosted npm from selected Node installation
        shell: bash
        run: node scripts/publication-npm.js acquire
      - name: Qualify retained archives and installed-platform provenance before publication
        run: node scripts/qualify-public-registry.mjs --manifest frozen-release/release-manifest.json --provenance --publication-origins frozen-release/publication-origins.json --publication-source "$GITHUB_SHA" --publication-run "$GITHUB_RUN_ID" --publication-attempt "$GITHUB_RUN_ATTEMPT" --recovery-run "$RECOVERY_RUN" --recovery-attempt "$RECOVERY_ATTEMPT" --recovery-origins-sha256 "$RECOVERY_ORIGINS_SHA" --retained-only retained-qualification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: retained-registry-${{ matrix.os }}
          path: retained-qualification.json
          if-no-files-found: error
          retention-days: 90
  stage:
    needs: [admit, retained]
    if: always() && needs.admit.result == 'success' && (needs.retained.result == 'success' || (needs.retained.result == 'skipped' && inputs.recovery-run == '')) && github.repository == 'Hadden-Industries/markdown-quality' && github.ref == 'refs/heads/main'
    environment: npm-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Select isolated npm configuration
        shell: bash
        run: node scripts/publication-npm.js isolate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-release
          path: frozen-release
          run-id: ${{ inputs.candidate-run }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: publication-admission
          digest-mismatch: error
      - name: Revalidate exact admitted origin-map context
        run: node scripts/prepare-publication-environment.js --environment frozen-release
      - name: Acquire pinned hosted npm from selected Node installation
        shell: bash
        run: node scripts/publication-npm.js acquire
      - name: Stage Windows package under pilot
        if: env.STAGE_WIN32_X64 == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > provider/current-ref.json
          node scripts/prepare-publication-environment.js --current-ref provider/current-ref.json
          node scripts/wait-registry-integrity.js --absent @hadden-industries/markdown-quality-win32-x64 "$RELEASE_VERSION"
          node scripts/stage-release-package.js win32-x64 frozen-release staging-journal
      - name: Stage Linux package under pilot
        if: env.STAGE_LINUX_X64 == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > provider/current-ref.json
          node scripts/prepare-publication-environment.js --current-ref provider/current-ref.json
          node scripts/wait-registry-integrity.js --absent @hadden-industries/markdown-quality-linux-x64 "$RELEASE_VERSION"
          node scripts/stage-release-package.js linux-x64 frozen-release staging-journal
      - name: Verify both native archives before core staging
        if: env.STAGE_CORE == 'true'
        run: node scripts/qualify-public-registry.mjs --manifest frozen-release/release-manifest.json --provenance --publication-origins frozen-release/publication-origins.json --publication-source "$GITHUB_SHA" --publication-run "$GITHUB_RUN_ID" --publication-attempt "$GITHUB_RUN_ATTEMPT" --recovery-run "$RECOVERY_RUN" --recovery-attempt "$RECOVERY_ATTEMPT" --recovery-origins-sha256 "$RECOVERY_ORIGINS_SHA" --native-only native-before-core.json
      - name: Stage coherent core under pilot
        if: env.STAGE_CORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > provider/current-ref.json
          node scripts/prepare-publication-environment.js --current-ref provider/current-ref.json
          node scripts/wait-registry-integrity.js --absent @hadden-industries/markdown-quality "$RELEASE_VERSION"
          node scripts/stage-release-package.js core frozen-release staging-journal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: publication-source-and-manifest
          path: |
            provider/*.json
            frozen-release/release-manifest.json
            frozen-release/publication-origins.json
            native-before-core.json
            staging-journal/
          if-no-files-found: error
          retention-days: 90
