name: Fresh release qualification fallback
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    outputs:
      archive-id:
        description: Original qualified archive tuple
        value: ${{ jobs.product.outputs.archive-id }}
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  resolve:
    if: github.repository == 'Hadden-Industries/markdown-quality' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    outputs:
      runtimes: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - name: Check requested version and freeze one matrix for all release gates
        id: resolve
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("package.json")); assert.match(process.env.RELEASE_VERSION,/^[1-9]\d*\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u); assert.equal(p.version,process.env.RELEASE_VERSION);'
          matrix=$(node scripts/node-matrix.js)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Check source presentation before fan-out
        run: npm run check:source
  product:
    needs: resolve
    uses: ./.github/workflows/qualification.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      matrix: ${{ needs.resolve.outputs.runtimes }}
      release-mode: true
  scans:
    needs: resolve
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
  native:
    needs: resolve
    uses: ./.github/workflows/native-qualification.yml
  dependencies:
    needs: resolve
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - run: npm run check:dependency-audit
  qualified:
    needs:
      - resolve
      - product
      - scans
      - dependencies
      - native
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; const n=JSON.parse(process.env.NEEDS_JSON); assert.deepEqual(Object.keys(n).sort(),["dependencies","native","product","resolve","scans"]); for(const j of Object.values(n)) assert.equal(j.result,"success");'
