name: Qualify owner-approved public release
on:
  workflow_dispatch:
    inputs:
      candidate-run:
        description: Original completed deliberate qualification run
        required: true
        type: string
      manifest-sha256:
        description: Original approved release manifest digest
        required: true
        type: string
      staging-run:
        description: Completed core staging continuation after both native approvals
        required: true
        type: string
      staging-attempt:
        description: Exact completed core staging attempt
        required: true
        type: string
      origins-sha256:
        description: Approved origin map from that core staging attempt
        required: true
        type: string
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  NODE_AUTH_TOKEN: ""
  NPM_TOKEN: ""
  NPM_CONFIG_TOKEN: ""
  NODE_OPTIONS: ""
  CANDIDATE_RUN: ${{ inputs.candidate-run }}
  MANIFEST_SHA: ${{ inputs.manifest-sha256 }}
  STAGING_RUN: ${{ inputs.staging-run }}
  STAGING_ATTEMPT: ${{ inputs.staging-attempt }}
  ORIGINS_SHA: ${{ inputs.origins-sha256 }}
jobs:
  admit:
    if: github.repository == 'Hadden-Industries/markdown-quality' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      runtimes: ${{ steps.admit.outputs.runtimes }}
      reference: ${{ steps.admit.outputs.reference }}
      consumer-npm: ${{ steps.admit.outputs.consumer-npm }}
      source: ${{ steps.admit.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - uses: ./.github/actions/setup-python
      - name: Acquire the authenticated original qualification archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: node scripts/download-release-archive.js "$CANDIDATE_RUN" "frozen-release"
        timeout-minutes: 15
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: publication-source-and-manifest
          path: previous-stage
          run-id: ${{ inputs.staging-run }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - id: admit
        name: Reconcile completed stage and original qualified identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-continuation.js frozen-release previous-stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-release-inputs-${{ github.run_attempt }}
          path: frozen-release/
          if-no-files-found: error
          retention-days: 90
  registry:
    needs: admit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.admit.outputs.runtimes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ needs.admit.outputs.reference }}
          package-manager-cache: false
      - run: node scripts/publication-npm.js isolate
      - id: provenance-tool
        run: node scripts/publication-npm.js acquire
      - run: node scripts/qualification-process.js consumer-npm "${{ runner.temp }}/consumer-npm"
        env:
          CONSUMER_NPM: ${{ needs.admit.outputs.consumer-npm }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: public-release-inputs-${{ github.run_attempt }}
          path: frozen-release
          digest-mismatch: error
      - name: Verify all public bytes and installed-platform provenance in both layouts
        env:
          PROVENANCE_NODE: ${{ steps.provenance-tool.outputs.node-executable }}
          RELEASE_SECURITY_OUTPUT: ${{ matrix.node == needs.admit.outputs.reference && 'recipient-security' || '' }}
          MARKDOWN_QUALITY_CONSUMER_NPM: ${{ runner.temp }}/consumer-npm/node_modules/npm/bin/npm-cli.js
        run: node scripts/verify-public-tuple.js frozen-release registry-qualification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: registry-${{ matrix.os }}-${{ matrix.node }}-${{ github.run_attempt }}
          path: registry-qualification.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && matrix.node == needs.admit.outputs.reference
        with:
          name: recipient-${{ matrix.os }}
          path: recipient-security/
          if-no-files-found: error
          retention-days: 90
  security:
    needs:
      - admit
      - registry
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: public-release-inputs-${{ github.run_attempt }}
          path: frozen-release
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: recipient-*
          path: recipient-security
          digest-mismatch: error
      - name: Recheck exact package source and the publicly resolved recipient graph
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ needs.admit.outputs.source }}
        run: node scripts/qualify-release-security.js frozen-release release-security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: public-release-security-${{ github.run_attempt }}
          path: release-security/
          if-no-files-found: error
          retention-days: 90
  qualified:
    needs:
      - admit
      - registry
      - security
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Require the complete public tuple and security gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; const needs=JSON.parse(process.env.NEEDS_JSON); assert.deepEqual(Object.keys(needs).sort(),["admit","registry","security"]); for(const [name,job] of Object.entries(needs)) assert.equal(job.result,"success",name);'
          echo 'All public package/runtime lanes and security checks passed. Record this run and attempt for deliberate GitHub archival. Stable promotion is a separate operation.' >> "$GITHUB_STEP_SUMMARY"
