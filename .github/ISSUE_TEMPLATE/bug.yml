name: Bug report
description: Report a reproducible Markdown Quality defect.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Report security issues through [private vulnerability reporting](https://github.com/Hadden-Industries/markdown-quality/security/advisories/new).
        Do not include credentials, private documents or personal information here.
  - type: input
    id: version
    attributes:
      label: Package version or source commit
      description: Include the exact version, not only a moving tag such as latest.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, architecture and Node version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal input, configuration and command
      description: Provide non-sensitive text and exact commands; include relevant native error details.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Give the command, exit code and diagnostics. For a repair, say whether you used preview or write mode.
    validations:
      required: true
