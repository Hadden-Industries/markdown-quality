name: Set up repository Python minimum
description: Read the stable repository minimum and create the hosted isolated Python environment
runs:
  using: composite
  steps:
    - id: python-target
      shell: bash
      run: bash .github/actions/setup-python/read-target.sh
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ steps.python-target.outputs.version }}
    - name: Create the hosted Python environment
      shell: bash
      run: |
        python -m venv "$RUNNER_TEMP/python"
        echo "VIRTUAL_ENV=$RUNNER_TEMP/python" >> "$GITHUB_ENV"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "$RUNNER_TEMP/python/Scripts" >> "$GITHUB_PATH"
        else
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
        fi
