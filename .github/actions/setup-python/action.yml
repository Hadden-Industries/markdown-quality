name: Set up repository Python minimum
description: Read the stable repository minimum and create the hosted isolated Python environment
runs:
  using: composite
  steps:
    - id: python-target
      shell: bash
      run: bash .github/actions/setup-python/read-target.sh
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ steps.python-target.outputs.version }}
        version: "0.13.6"
        activate-environment: true
        venv-path: ${{ runner.temp }}/python
        no-project: true
        enable-cache: false
